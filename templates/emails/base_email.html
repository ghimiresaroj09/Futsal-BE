<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Futsal Management System{% endblock %}</title>

```
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 40px 20px;
        background: #f3f7f5;
        font-family: Arial, Helvetica, sans-serif;
        color: #1f2933;
        line-height: 1.6;
    }

    .email-wrapper {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
    }

    .email-card {
        background: #ffffff;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #e5ebe7;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    /* Header */
    .header {
        background: linear-gradient(135deg, #087a3f, #0da65a);
        padding: 28px 32px;
        text-align: center;
    }

    /* Logo circle */
    .logo {
        width: 54px;
        height: 54px;
        margin: 0 auto 12px;
        background: #ffffff;
        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        text-align: center;
    }

    /* Soccer ball */
    .logo-ball {
        display: block;
        width: 100%;
        height: 100%;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 27px;
        line-height: 54px;
        text-align: center;

        margin: 0;
        padding: 0;
    }

    .brand-name {
        margin: 0;
        color: #ffffff;
        font-size: 22px;
        font-weight: 700;
        line-height: 1.3;
    }

    .header-subtitle {
        margin: 5px 0 0;
        color: #dff7e9;
        font-size: 13px;
        line-height: 1.4;
    }

    /* Main content */
    .content {
        padding: 36px 32px;
    }

    .content h2 {
        margin: 0 0 20px;
        color: #087a3f;
        font-size: 24px;
        line-height: 1.3;
    }

    .content p {
        margin: 0 0 16px;
        color: #4b5563;
        font-size: 15px;
        line-height: 1.6;
    }

    /* OTP */
    .otp-box {
        margin: 28px 0;
        padding: 20px;
        background: #f0faf4;
        border: 1px solid #ccebd8;
        border-radius: 12px;
        text-align: center;
    }

    .otp-code {
        margin: 0;
        color: #087a3f;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 8px;
        line-height: 1.2;
    }

    /* Button */
    .button {
        display: inline-block;
        padding: 13px 26px;
        background: #087a3f;
        color: #ffffff !important;
        text-decoration: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
    }

    /* Footer */
    .footer {
        padding: 22px 32px;
        background: #f8faf9;
        border-top: 1px solid #e5ebe7;
        text-align: center;
    }

    .footer p {
        margin: 0;
        color: #7b8794;
        font-size: 12px;
        line-height: 1.5;
    }

    /* Mobile */
    @media only screen and (max-width: 600px) {

        body {
            padding: 20px 12px;
        }

        .header {
            padding: 24px 20px;
        }

        .content {
            padding: 28px 20px;
        }

        .footer {
            padding: 20px;
        }

        .content h2 {
            font-size: 21px;
        }

        .brand-name {
            font-size: 20px;
        }

        .otp-code {
            font-size: 26px;
            letter-spacing: 6px;
        }

        .logo {
            width: 52px;
            height: 52px;
        }

        .logo-ball {
            font-size: 25px;
            line-height: 52px;
        }
    }
</style>
```

</head>

<body>

```
<div class="email-wrapper">

    <div class="email-card">

        <!-- Header -->
        <div class="header">

            <div class="logo">
                <span class="logo-ball">⚽</span>
            </div>

            <p class="brand-name">
                Futsal Management System
            </p>

            <p class="header-subtitle">
                Book. Play. Enjoy.
            </p>

        </div>

        <!-- Content -->
        <div class="content">

            <h2>
                {% block heading %}
                    Futsal Management System
                {% endblock %}
            </h2>

            {% block content %}{% endblock %}

        </div>

        <!-- Footer -->
        <div class="footer">

            <p>
                This is an automated message, please do not reply.
            </p>

            <p style="margin-top: 6px;">
                © {% now "Y" %} Futsal Management System.
                All rights reserved.
            </p>

        </div>

    </div>

</div>
```

</body>
</html>
