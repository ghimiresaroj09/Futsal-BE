        phone_number:
          type: string
          maxLength: 20
        notes:
          type: string
        reason:
          type: string
          maxLength: 255
        advance_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
    AdminBookingUpdateRequest:
