components:
  schemas:
    AdminBookingCreate:
      type: object
      properties:
        slot_id:
          type: string
          format: uuid
        full_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        phone_number:
          type: string
          maxLength: 20
        notes:
          type: string
          default: ''
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          default: CASH
        status:
          allOf:
          - $ref: '#/components/schemas/AdminBookingCreateStatusEnum'
          default: PENDING
        advance_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - email
      - full_name
      - phone_number
      - slot_id
    AdminBookingCreateRequest:
      type: object
      properties:
        slot_id:
          type: string
          format: uuid
        full_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          minLength: 1
        phone_number:
          type: string
          minLength: 1
          maxLength: 20
        notes:
          type: string
          default: ''
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          default: CASH
        status:
          allOf:
          - $ref: '#/components/schemas/AdminBookingCreateStatusEnum'
          default: PENDING
        advance_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - email
      - full_name
      - phone_number
      - slot_id
    AdminBookingCreateStatusEnum:
      enum:
      - PENDING
      - CONFIRMED
      type: string
      description: |-
        * `PENDING` - PENDING
        * `CONFIRMED` - CONFIRMED
    AdminBookingUpdate:
      type: object
