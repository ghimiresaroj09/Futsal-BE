      - internal
      security:
      - {}
      responses:
        '200':
          description: Reminders dispatched.
        '401':
          description: Missing or invalid cron secret.
  /api/v1/slots/:
    get:
      operationId: slots_list
      description: Read-only slot access for users. Users can never modify slots.
      summary: List upcoming slots date-wise
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Filter by date (YYYY-MM-DD)
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - in: query
        name: futsal
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      - in: query
        name: status
        schema:
          type: string
      tags:
      - slots
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSlotList'
          description: ''
  /api/v1/slots/{id}/:
    get:
      operationId: slots_retrieve
      description: Read-only slot access for users. Users can never modify slots.
      summary: Retrieve a slot
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this slot.
        required: true
      tags:
      - slots
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
          description: ''
  /api/v1/slots/date-wise/:
    get:
      operationId: slots_date_wise_retrieve
      description: Read-only slot access for users. Users can never modify slots.
      summary: List slots for a specific date
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Date to retrieve slots for (YYYY-MM-DD)
        required: true
      tags:
      - slots
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
          description: ''
  /api/v1/users/me/:
    get:
      operationId: users_me_retrieve
      summary: Retrieve or update the authenticated user's profile
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: users_me_partial_update
      summary: Retrieve or update the authenticated user's profile
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /healthz/:
    get:
      operationId: healthz_retrieve
      description: Returns 200 when the application and database are reachable.
      summary: Health check
      tags:
      - internal
      security:
      - {}
      responses:
        '200':
          description: Service healthy.
        '503':
          description: Database unreachable.
