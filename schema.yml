openapi: 3.0.3
info:
  title: Futsal Management System API
  version: 1.0.0
  description: REST API for futsal venue, slot, booking, payment and reminder management.
paths:
  /api/v1/admin/bookings/:
    get:
      operationId: admin_bookings_list
      description: Full booking management for admins.
      parameters:
      - in: query
        name: booking_reference
        schema:
          type: string
      - in: query
        name: date
        schema:
          type: string
          format: date
      - in: query
        name: email
        schema:
          type: string
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - in: query
        name: futsal
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: phone
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      - in: query
        name: status
        schema:
          type: string
      tags:
      - admin-bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: admin_bookings_create
      description: Full booking management for admins.
      summary: Admin creates a booking on behalf of a customer
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Filter by slot date
      tags:
      - admin-bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBookingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminBookingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminBookingCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingCreate'
          description: ''
  /api/v1/admin/bookings/{id}/:
    get:
      operationId: admin_bookings_retrieve
      description: Full booking management for admins.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this booking.
        required: true
      tags:
      - admin-bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
    put:
      operationId: admin_bookings_update
      description: Full booking management for admins.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this booking.
        required: true
      tags:
      - admin-bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBookingUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminBookingUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminBookingUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingUpdate'
          description: ''
    patch:
      operationId: admin_bookings_partial_update
      description: Full booking management for admins.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this booking.
        required: true
      tags:
      - admin-bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminBookingUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminBookingUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminBookingUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingUpdate'
          description: ''
    delete:
      operationId: admin_bookings_destroy
      description: Full booking management for admins.
      summary: Cancel a booking
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this booking.
        required: true
      tags:
      - admin-bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDeleteResponse'
          description: ''
  /api/v1/admin/bookings/{id}/cancel/:
    post:
      operationId: admin_bookings_cancel_create
      description: Full booking management for admins.
      summary: Cancel a booking
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this booking.
        required: true
      tags:
      - admin-bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/admin/bookings/{id}/complete/:
    post:
      operationId: admin_bookings_complete_create
      description: Full booking management for admins.
      summary: Mark a booking as completed
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this booking.
        required: true
      tags:
      - admin-bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/admin/bookings/{id}/reminders/:
    get:
      operationId: admin_bookings_reminders_list
      description: Returns automatic and manually sent reminder records for this booking,
        newest first.
      summary: List reminders for one booking
      parameters:
      - in: query
        name: booking_reference
        schema:
          type: string
      - in: query
        name: date
        schema:
          type: string
          format: date
      - in: query
        name: email
        schema:
          type: string
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - in: query
        name: futsal
        schema:
          type: string
          format: uuid
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this booking.
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: phone
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      - in: query
        name: status
        schema:
          type: string
      tags:
      - admin-reminders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReminderList'
          description: ''
  /api/v1/admin/bookings/{id}/reschedule/:
    patch:
      operationId: admin_bookings_reschedule_partial_update
      description: Full booking management for admins.
      summary: Reschedule any booking
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this booking.
        required: true
      tags:
      - admin-bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRescheduleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRescheduleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRescheduleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reschedule'
          description: ''
  /api/v1/admin/bookings/{id}/send-reminder/:
    post:
      operationId: admin_bookings_send_reminder_create
      description: Full booking management for admins.
      summary: Manually send a booking reminder email
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this booking.
        required: true
      tags:
      - admin-reminders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/admin/change-password/:
    post:
      operationId: admin_change_password_create
      summary: Admin change password
      tags:
      - admin-profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/contact/:
    get:
      operationId: admin_contact_list
      description: Wraps successful generic-view responses in {success,message,data}.
      summary: Admin contact message management
      parameters:
      - in: query
        name: email
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - IN_PROGRESS
          - NEW
          - RESOLVED
        description: |-
          * `NEW` - New
          * `IN_PROGRESS` - In progress
          * `RESOLVED` - Resolved
      tags:
      - admin-contact
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContactMessageList'
          description: ''
  /api/v1/admin/contact/{id}/:
    get:
      operationId: admin_contact_retrieve
      description: Wraps successful generic-view responses in {success,message,data}.
      summary: Admin contact message management
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this contact message.
        required: true
      tags:
      - admin-contact
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessage'
          description: ''
    put:
      operationId: admin_contact_update
      description: Wraps successful generic-view responses in {success,message,data}.
      summary: Admin contact message management
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this contact message.
        required: true
      tags:
      - admin-contact
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminContactUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminContactUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminContactUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminContactUpdate'
          description: ''
    patch:
      operationId: admin_contact_partial_update
      description: Wraps successful generic-view responses in {success,message,data}.
      summary: Admin contact message management
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this contact message.
        required: true
      tags:
      - admin-contact
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminContactUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminContactUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminContactUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminContactUpdate'
          description: ''
  /api/v1/admin/futsal/:
    get:
      operationId: admin_futsal_retrieve
      description: Admin read/update of the single futsal. Creation/deletion is not
        supported.
      summary: View or update the futsal configuration
      tags:
      - admin-futsal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Futsal'
          description: ''
    patch:
      operationId: admin_futsal_partial_update
      description: Admin read/update of the single futsal. Creation/deletion is not
        supported.
      summary: View or update the futsal configuration
      tags:
      - admin-futsal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFutsalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFutsalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFutsalRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Futsal'
          description: ''
  /api/v1/admin/media/:
    get:
      operationId: admin_media_list
      description: Upload and manage gallery assets.
      parameters:
      - in: query
        name: is_cover
        schema:
          type: boolean
      - in: query
        name: media_type
        schema:
          type: string
          enum:
          - IMAGE
          - VIDEO
        description: |-
          * `IMAGE` - Image
          * `VIDEO` - Video
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin-media
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFutsalMediaList'
          description: ''
    post:
      operationId: admin_media_create
      description: Upload and manage gallery assets.
      summary: Upload an image or video
      tags:
      - admin-media
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FutsalMediaUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FutsalMediaUploadRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/FutsalMediaUploadRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FutsalMedia'
          description: ''
  /api/v1/admin/media/{id}/:
    get:
      operationId: admin_media_retrieve
      description: Upload and manage gallery assets.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this futsal media.
        required: true
      tags:
      - admin-media
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FutsalMedia'
          description: ''
    put:
      operationId: admin_media_update
      description: Upload and manage gallery assets.
      summary: Update media metadata
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this futsal media.
        required: true
      tags:
      - admin-media
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FutsalMediaUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FutsalMediaUploadRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/FutsalMediaUploadRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FutsalMedia'
          description: ''
    patch:
      operationId: admin_media_partial_update
      description: Upload and manage gallery assets.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this futsal media.
        required: true
      tags:
      - admin-media
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFutsalMediaUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFutsalMediaUploadRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFutsalMediaUploadRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FutsalMediaUpload'
          description: ''
    delete:
      operationId: admin_media_destroy
      description: Upload and manage gallery assets.
      summary: Delete media and its stored asset
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this futsal media.
        required: true
      tags:
      - admin-media
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/notifications/:
    get:
      operationId: admin_notifications_list
      description: Returns only the current admin's in-app notifications, newest first.
        `unread_count` is the total unread count before any read-state filter.
      summary: List booking notifications
      parameters:
      - in: query
        name: is_read
        schema:
          type: boolean
        description: Boolean alias for the `read` filter.
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: read
        schema:
          type: string
          enum:
          - read
          - unread
        description: 'Optional state filter: `read` or `unread` (also accepts true/false).'
      tags:
      - admin-notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotificationList'
          description: ''
  /api/v1/admin/notifications/{id}/:
    get:
      operationId: admin_notifications_retrieve
      description: Notifications belonging only to the authenticated administrator.
      summary: Admin in-app booking notifications
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this admin notification.
        required: true
      tags:
      - admin-notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotification'
          description: ''
  /api/v1/admin/notifications/{id}/mark-read/:
    post:
      operationId: admin_notifications_mark_read_create
      description: Marks a notification owned by the current admin as read and returns
        the updated unread badge count.
      summary: Mark one notification as read
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this admin notification.
        required: true
      tags:
      - admin-notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotificationAction'
          description: ''
  /api/v1/admin/notifications/{id}/mark-unread/:
    post:
      operationId: admin_notifications_mark_unread_create
      description: Marks a notification owned by the current admin as unread and returns
        the updated unread badge count.
      summary: Mark one notification as unread
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this admin notification.
        required: true
      tags:
      - admin-notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotificationAction'
          description: ''
  /api/v1/admin/notifications/mark-all-read/:
    post:
      operationId: admin_notifications_mark_all_read_create
      description: Marks every unread notification for the current admin as read.
      summary: Mark all notifications as read
      tags:
      - admin-notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllNotificationsRead'
          description: ''
  /api/v1/admin/profile/:
    get:
      operationId: admin_profile_retrieve
      summary: Admin profile (view and update)
      tags:
      - admin-profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: admin_profile_partial_update
      summary: Admin profile (view and update)
      tags:
      - admin-profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/admin/reminders/:
    get:
      operationId: admin_reminders_list
      description: Wraps successful generic-view responses in {success,message,data}.
      summary: Reminder history (automatic and manual)
      parameters:
      - in: query
        name: booking
